---
name: Lint, Test, and Publish

on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_VERSION: '0.13.8'

jobs:
  lint:
    name: Lint / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install shell and YAML linters
        run: |
          sudo apt-get update
          sudo apt-get install -y yamllint shellcheck shfmt
      - run: uv sync --locked --all-groups
      - run: ./scripts/lint.sh

  test:
    name: Tests and coverage / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: ./scripts/test.sh
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.python-version }}
          path: logs/

  build:
    name: Build and install distributions
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: '3.15'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked --all-groups
      - name: Set version from release tag
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: uv run --locked python scripts/prepare_release.py "$RELEASE_TAG"
      - run: uv build --no-sources
      - name: Check distribution metadata
        # Release preparation intentionally changes the version without re-locking.
        run: uv run --no-sync twine check --strict dist/*
      - name: Install and smoke-test wheel and source archive
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          ./scripts/check_dist.sh dist "$version"
      - name: Store distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  pypi-publish:
    name: Publish to PyPI
    if: github.event_name == 'release'
    needs: [lint, test, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/daybetter-ble-client
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish with trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
