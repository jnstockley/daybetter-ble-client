[project]
name = "daybetter-ble-client"
version = "1.0.0"
description = "Async Bluetooth Low Energy control for Daybetter P031 and P065 LED strips"
readme = "README.md"
requires-python = ">=3.11,<3.16"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Siddhant Kameswar", email = "61r7jw39@kameswar.com" },
    { name = "Jack Stockley", email = "jack@jstockley.com" },
]
dependencies = [
    "bleak>=3.0.2,<4",
    "bleak-retry-connector>=4.7.1,<5",
]

[project.urls]
Homepage = "https://github.com/jnstockley/daybetter-led-strip"
Repository = "https://github.com/jnstockley/daybetter-led-strip.git"
Issues = "https://github.com/jnstockley/daybetter-led-strip/issues"
Upstream = "https://github.com/grimsteel/daybetter-led-strip"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["examples", ".*"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["daybetter_ble_client"]

[tool.coverage.report]
show_missing = true
fail_under = 95

[dependency-groups]
dev = [
    "packaging>=25.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
    "twine>=6.0",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
